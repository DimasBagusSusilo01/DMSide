<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DMSide — Hand Tracking IDE</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

<div class="ide">


    <!-- =========================
         TOP BAR
    ========================== -->

    <header class="topbar">

        <div class="brand">

            <div class="brand-icon">
                D
            </div>

            <div class="brand-name">
                DMSide
            </div>

        </div>


        <div class="project-name">

            <span id="projectName">
                Untitled Project
            </span>

        </div>


        <div class="top-actions">

            <button
                class="top-button secondary"
                id="saveButton"
            >
                Save
            </button>

            <button
                class="top-button run"
                id="runButton"
            >
                ▶ Run
            </button>

        </div>

    </header>



    <!-- =========================
         MAIN WORKSPACE
    ========================== -->

    <main class="workspace-layout">


        <!-- =====================
             LEFT TOOLBOX
        ====================== -->

        <aside
            class="panel toolbox-panel"
            id="toolboxPanel"
        >

            <div class="panel-header">

                <span>
                    Blocks
                </span>

                <button
                    class="panel-icon"
                    id="closeToolbox"
                >
                    ×
                </button>

            </div>


            <div class="toolbox-search">

                <input
                    type="text"
                    placeholder="Search blocks..."
                    id="blockSearch"
                >

            </div>


            <!-- EVENTS -->

            <section class="block-category">

                <div class="category-title events">
                    ⚡ Events
                </div>

                <button class="block-item event-block">
                    <span>▶</span>
                    When started
                </button>

                <button class="block-item event-block">
                    <span>🤏</span>
                    When pinch
                </button>

                <button class="block-item event-block">
                    <span>🖐</span>
                    When hand detected
                </button>

            </section>


            <!-- HAND -->

            <section class="block-category">

                <div class="category-title hand">
                    🖐 Hand
                </div>

                <button class="block-item hand-block">
                    Get finger position
                </button>

                <button class="block-item hand-block">
                    Get hand position
                </button>

            </section>


            <!-- CONTROL -->

            <section class="block-category">

                <div class="category-title control">
                    🔄 Control
                </div>

                <button class="block-item control-block">
                    If
                </button>

                <button class="block-item control-block">
                    Repeat
                </button>

                <button class="block-item control-block">
                    Wait
                </button>

            </section>


            <!-- DISPLAY -->

            <section class="block-category">

                <div class="category-title display">
                    🎨 Display
                </div>

                <button class="block-item display-block">
                    Show text
                </button>

                <button class="block-item display-block">
                    Change color
                </button>

            </section>


            <!-- AUDIO -->

            <section class="block-category">

                <div class="category-title audio">
                    🔊 Audio
                </div>

                <button class="block-item audio-block">
                    Play sound
                </button>

                <button class="block-item audio-block">
                    Stop sound
                </button>

            </section>

        </aside>



        <!-- =====================
             CENTER
        ====================== -->

        <section class="center-area">


            <!-- MOBILE PREVIEW HEADER -->

            <div class="mobile-section-header">

                <span>
                    Preview
                </span>

                <span
                    class="status"
                    id="trackingStatus"
                >
                    ● Offline
                </span>

            </div>


            <!-- CAMERA -->

            <div class="preview-area">

                <div class="preview-toolbar">

                    <span>
                        Preview
                    </span>

                    <span
                        class="status"
                        id="desktopStatus"
                    >
                        ● Offline
                    </span>

                </div>


                <div class="camera-container">

                    <video
                        id="camera"
                        autoplay
                        playsinline
                        muted
                    ></video>

                    <canvas
                        id="canvas"
                    ></canvas>


                    <!-- CAMERA PLACEHOLDER -->

                    <div
                        class="camera-placeholder"
                        id="cameraPlaceholder"
                    >

                        <div class="camera-icon">
                            📷
                        </div>

                        <div>
                            Camera preview
                        </div>

                        <small>
                            Press Run to start tracking
                        </small>

                    </div>

                </div>


                <!-- CAMERA CONTROLS -->

                <div class="camera-controls">

                    <button
                        class="camera-button"
                        id="startCamera"
                    >
                        📷 Start Camera
                    </button>

                    <button
                        class="camera-button"
                        id="flipCamera"
                    >
                        🔄 Flip
                    </button>

                </div>

            </div>



            <!-- BLOCK WORKSPACE -->

            <div class="block-workspace">

                <div class="workspace-header">

                    <span>
                        Workspace
                    </span>

                    <div>

                        <button
                            class="small-button"
                            id="clearWorkspace"
                        >
                            Clear
                        </button>

                        <button
                            class="small-button"
                            id="zoomWorkspace"
                        >
                            100%
                        </button>

                    </div>

                </div>


                <div
                    class="workspace-canvas"
                    id="blockWorkspace"
                >

                    <!-- TEMPORARY BLOCKS
                         NANTI DIGANTI BLOCKLY -->

                    <div class="demo-stack">

                        <div class="demo-block event">

                            <span>⚡</span>

                            WHEN PINCH

                        </div>


                        <div class="connection-line"></div>


                        <div class="demo-block display">

                            <span>🎨</span>

                            SHOW

                            <input
                                type="text"
                                value="Hello!"
                            >

                        </div>

                    </div>


                    <div class="workspace-hint">

                        Drag blocks here

                    </div>

                </div>

            </div>

        </section>



        <!-- =====================
             RIGHT PREVIEW / INFO
        ====================== -->

        <aside class="panel inspector-panel">


            <div class="panel-header">

                <span>
                    Inspector
                </span>

            </div>


            <!-- TRACKING -->

            <section class="inspector-section">

                <h3>
                    Tracking
                </h3>


                <div class="tracking-card">

                    <div class="tracking-icon">
                        🖐
                    </div>

                    <div>

                        <strong>
                            Hand
                        </strong>

                        <small id="handStatus">
                            Not detected
                        </small>

                    </div>

                </div>

            </section>


            <!-- LANDMARK -->

            <section class="inspector-section">

                <h3>
                    Index Finger
                </h3>


                <div class="property-row">

                    <span>
                        X
                    </span>

                    <strong id="posX">
                        0.000
                    </strong>

                </div>


                <div class="property-row">

                    <span>
                        Y
                    </span>

                    <strong id="posY">
                        0.000
                    </strong>

                </div>


                <div class="property-row">

                    <span>
                        Z
                    </span>

                    <strong id="posZ">
                        0.000
                    </strong>

                </div>

            </section>


            <!-- PROJECT -->

            <section class="inspector-section">

                <h3>
                    Project
                </h3>


                <button class="inspector-button">
                    📁 New Project
                </button>

                <button class="inspector-button">
                    💾 Save Project
                </button>

                <button class="inspector-button">
                    📤 Export
                </button>

            </section>

        </aside>

    </main>



    <!-- =========================
         MOBILE NAVIGATION
    ========================== -->

    <nav class="mobile-nav">

        <button
            class="mobile-nav-button active"
            data-panel="blocks"
        >

            <span>🧩</span>

            <small>
                Blocks
            </small>

        </button>


        <button
            class="mobile-nav-button"
            data-panel="preview"
        >

            <span>📷</span>

            <small>
                Preview
            </small>

        </button>


        <button
            class="mobile-nav-button"
            data-panel="inspector"
        >

            <span>⚙️</span>

            <small>
                Settings
            </small>

        </button>

    </nav>


</div>


<script
    type="module"
    src="app.js"
></script>

</body>

</html>
